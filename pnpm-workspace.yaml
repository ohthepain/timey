packages:
  - src/server/auth-runtime

# Script runs must not reinstall. A commit hook and the exported verifier share the
# checkout's node_modules and compare the lockfile byte for byte.
verifyDepsBeforeRun: false

allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': false
  '@prisma/engines': false
  esbuild: true
  prisma: false

permissions:
  drizzle-kit:
    skills: false
  fallow:
    skills: false

minimumReleaseAgeExclude:
  - nitro@3.0.261029-rc
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5
  vite-plus: 1.4.0
  '@vitest/coverage-v8': 5.0.5
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
