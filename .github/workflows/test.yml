name: Verify

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read
  actions: read

env:
  AUDIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  early:
    name: Early checks
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.verify.outputs.artifact-id }}
      base: ${{ steps.verify.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/verify-suite
        id: verify
        with:
          suite: early
          base: ${{ env.AUDIT_BASE }}

  non-browser-1:
    name: Non-browser tests (1/2)
    needs: early
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.verify.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/verify-suite
        id: verify
        with:
          suite: non-browser-1
          base: ${{ needs.early.outputs.base }}

  non-browser-2:
    name: Non-browser tests (2a/2)
    needs: early
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.verify.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/verify-suite
        id: verify
        with:
          suite: non-browser-2
          base: ${{ needs.early.outputs.base }}

  non-browser-app:
    name: Non-browser tests (2b/2)
    needs: early
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.verify.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/verify-suite
        id: verify
        with:
          suite: non-browser-app
          base: ${{ needs.early.outputs.base }}

  classic-browser:
    name: Classic Factory browser
    needs: early
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.verify.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/verify-suite
        id: verify
        with:
          suite: classic-browser
          base: ${{ needs.early.outputs.base }}

  flow-browser-1:
    name: Flow browser (1a/2)
    needs: early
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.verify.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/verify-suite
        id: verify
        with:
          suite: flow-browser-1
          base: ${{ needs.early.outputs.base }}

  flow-browser-1b:
    name: Flow browser (1b/2)
    needs: early
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.verify.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/verify-suite
        id: verify
        with:
          suite: flow-browser-1b
          base: ${{ needs.early.outputs.base }}

  flow-browser-2:
    name: Flow browser (2/2)
    needs: early
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.verify.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/verify-suite
        id: verify
        with:
          suite: flow-browser-2
          base: ${{ needs.early.outputs.base }}

  timey-browser:
    name: Timey browser
    needs: early
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.verify.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/verify-suite
        id: verify
        with:
          suite: timey-browser
          base: ${{ needs.early.outputs.base }}

  test:
    needs:
      [
        early,
        non-browser-1,
        non-browser-2,
        non-browser-app,
        classic-browser,
        flow-browser-1,
        flow-browser-1b,
        flow-browser-2,
        timey-browser,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Select evidence from the suite job outputs
        id: evidence
        env:
          SUITES: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const ids = Object.values(JSON.parse(process.env.SUITES))
            .map(({ outputs }) => outputs['artifact-id'])
            .filter((id) => /^\d+$/.test(id));
          if (ids.length) appendFileSync(process.env.GITHUB_OUTPUT, 'ids=' + ids.join(',') + '\n');
          JS
      - name: Download suite evidence
        if: steps.evidence.outputs.ids != ''
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.evidence.outputs.ids }}
          github-token: ${{ github.token }}
          path: .issues/evidence/
          merge-multiple: true
      - name: Assemble evidence for the verified candidate
        if: >-
          success() && !contains(needs.*.result, 'failure') &&
          !contains(needs.*.result, 'skipped') && !contains(needs.*.result, 'cancelled')
        env:
          AUDIT_BASE: ${{ needs.early.outputs.base }}
        run: node scripts/verify-ci-evidence.mjs "$AUDIT_BASE"
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: .issues/evidence/
          include-hidden-files: true
          overwrite: true
          if-no-files-found: ignore
      - name: Require all suites to pass
        if: always()
        env:
          SUITES: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          const suites = Object.entries(JSON.parse(process.env.SUITES));
          for (const [suite, { result }] of suites) console.log(suite + ': ' + result);
          process.exitCode = Number(suites.some(([, { result }]) => result !== 'success'));
          JS
