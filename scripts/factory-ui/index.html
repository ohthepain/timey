<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Factory · Issue queue</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font:
          15px/1.5 system-ui,
          sans-serif;
        background: #f4f3ed;
        color: #203b35;
      }
      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }
      h1 {
        font:
          500 clamp(30px, 4vw, 43px) / 1.15 Georgia,
          serif;
        letter-spacing: -0.7px;
      }
      h2 {
        font:
          500 25px/1.2 Georgia,
          serif;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      a {
        text-underline-offset: 3px;
      }
      button:hover:not(:disabled) {
        filter: brightness(0.95);
      }
    </style>
    <style>
      body {
        margin: 0;
      }
      main {
        max-width: 1200px;
        margin: 32px auto;
        padding: 0 24px;
      }
      header {
        padding: 18px 28px;
        border-bottom: 1px solid #ddd;
        display: flex;
        gap: 24px;
        align-items: center;
      }
      a {
        color: #285747;
      }
      button {
        cursor: pointer;
        padding: 9px 14px;
        border: 1px solid #bbc9bf;
        border-radius: 6px;
        background: #edf3ed;
        color: #244d3e;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      input,
      select,
      textarea {
        padding: 9px;
        border: 1px solid #ccc;
        border-radius: 5px;
        max-width: 100%;
        font: inherit;
      }
      textarea {
        width: 100%;
        box-sizing: border-box;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      td,
      th {
        text-align: left;
        padding: 14px 10px;
        border-bottom: 1px solid #ddd;
        vertical-align: top;
      }
      small,
      .muted {
        color: #657169;
      }
      .card {
        background: #fffef9;
        border: 1px solid #deded1;
        border-radius: 10px;
        padding: 20px;
        margin: 16px 0;
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 2.5fr) minmax(230px, 1fr);
        gap: 24px;
      }
      .rail {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin: 24px 0;
      }
      .rail span {
        padding: 6px 10px;
        border-radius: 16px;
        background: #eceee6;
      }
      .rail .current {
        background: #2c5848;
        color: white;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font:
          13px/1.6 ui-monospace,
          monospace;
      }
      details {
        margin: 12px 0;
      }
      summary {
        cursor: pointer;
      }
      dialog {
        max-width: 650px;
        width: calc(100% - 64px);
        border: 1px solid #aaa;
        border-radius: 12px;
        padding: 26px;
      }
      dialog::backdrop {
        background: #142a2266;
      }
      #error {
        color: #92352e;
      }
      #error:empty {
        display: none;
      }
      .toolbar {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
      }
      .badge {
        font-size: 12px;
        background: #eeeede;
        padding: 4px 8px;
        border-radius: 12px;
      }
      h1 {
        margin-bottom: 8px;
      }
      h2 {
        font-size: 24px;
      }
      h3 {
        font-size: 18px;
      }
      .actions {
        display: flex;
        gap: 10px;
        margin-top: 16px;
      }
      .prose {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .tablewrap {
        overflow: auto;
      }
      #notice {
        padding: 0 24px;
        color: #657169;
      }
      .issue-title {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        margin-top: 18px;
      }
      .issue-title h1 {
        flex: 1;
        min-width: 250px;
      }
      .lifecycle-heading {
        margin: 22px 0;
      }
      .issue-steps {
        position: relative;
      }
      .issue-step {
        margin: 0 0 14px;
        background: #fffefa;
        border: 1px solid #d7ded4;
        border-radius: 10px;
        overflow: hidden;
      }
      .issue-step.is-current {
        border-color: #2c705c;
        box-shadow: 0 0 0 1px #2c705c;
      }
      .issue-step > summary {
        list-style: none;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 20px;
      }
      .issue-step > summary::-webkit-details-marker {
        display: none;
      }
      .step-number {
        font:
          500 23px Georgia,
          serif;
        color: #6e7c72;
        min-width: 30px;
      }
      .is-current .step-number {
        color: #176d5a;
      }
      .step-heading {
        flex: 1;
        min-width: 0;
      }
      .step-heading strong {
        display: block;
        font:
          500 24px Georgia,
          serif;
        margin-bottom: 5px;
      }
      .step-description {
        display: block;
        font-size: 13px;
        color: #657169;
      }
      .step-label {
        font-size: 12px;
        color: #657169;
        max-width: 110px;
        text-align: right;
      }
      .is-current .step-label {
        color: #176d5a;
        font-weight: 600;
      }
      .step-chevron {
        color: #657169;
        transition: transform 0.15s;
      }
      .issue-step[open] > summary .step-chevron {
        transform: rotate(180deg);
      }
      .step-body {
        border-top: 1px solid #e4e7de;
        padding: 20px;
      }
      .step-body > .card:first-child {
        margin-top: 0;
      }
      .step-body > .card:last-child {
        margin-bottom: 0;
      }
      .next-action {
        background: #edf3eb;
        border: 1px solid #c8d9c8;
        border-radius: 8px;
        padding: 18px;
        display: flex;
        gap: 18px;
        align-items: center;
        margin-bottom: 20px;
      }
      .next-action > div {
        flex: 1;
        min-width: 0;
      }
      .next-action h3 {
        margin: 5px 0 8px;
      }
      .next-action p {
        margin: 0;
        font-size: 14px;
      }
      button.primary {
        background: #23604d;
        border-color: #23604d;
        color: white;
        white-space: nowrap;
      }
      .action-history {
        font-size: 13px;
      }
      .action-history dt {
        color: #657169;
      }
      .action-history dd {
        margin: 0 0 10px;
      }
      .commit-record {
        overflow-wrap: anywhere;
      }
      summary:focus-visible {
        outline: 2px solid #176d5a;
        outline-offset: -3px;
      }

      .latest-result {
        border: 2px solid #93b3d0;
        background: #f5f9ff;
      }
      .latest-result h4 {
        margin: 18px 0 6px;
      }
      .suggestion {
        border-top: 1px solid #cfdeec;
        margin-top: 18px;
      }
      .plan-problem {
        padding: 12px;
        background: #fff1e9;
        border-radius: 6px;
      }
      .implementation-checklist {
        margin: 8px 0 24px;
      }
      .implementation-step {
        border: 1px solid #d5dfdc;
        border-radius: 10px;
        margin: 10px 0;
        background: white;
      }
      .implementation-step > summary {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px;
        cursor: pointer;
      }
      .check-circle {
        display: inline-flex;
        flex: 0 0 25px;
        width: 25px;
        height: 25px;
        align-items: center;
        justify-content: center;
        border: 2px solid #208253;
        border-radius: 50%;
        color: #208253;
        font-size: 18px;
        font-weight: 700;
      }
      .check-passed {
        background: #2076c7;
        border-color: #2076c7;
        color: white;
      }
      .check-failed {
        background: #be393b;
        border-color: #be393b;
        color: white;
      }
      .check-not-checked {
        border-color: #7a858c;
        color: #65717a;
      }
      .check-reviewed,
      .check-skipped {
        border-color: #b2b8bb;
        color: #7a858c;
        background: #edf0f1;
      }
      .check-in-progress,
      .check-checking {
        background: #e3f3e8;
      }
      .check-label {
        font-size: 12px;
        font-weight: 500;
        color: #59676a;
        margin-left: auto;
        padding-left: 10px;
        white-space: nowrap;
      }
      .acceptance-list {
        padding: 0 16px 16px;
      }
      .acceptance-item {
        display: flex;
        gap: 12px;
        margin: 16px 0;
      }
      .acceptance-item > div {
        min-width: 0;
        flex: 1;
      }
      .acceptance-item p {
        margin: 6px 0 10px;
      }
      .acceptance-item details {
        margin: 8px 0;
      }
      .acceptance-item blockquote {
        border-left: 2px solid #c9d5d0;
        margin: 10px 0;
        padding-left: 12px;
        white-space: pre-wrap;
      }
      .evidence-button {
        overflow-wrap: anywhere;
        max-width: 100%;
        text-align: left;
        margin: 4px 0;
      }
      .required-decision {
        border-left: 3px solid #b23c3c;
        padding: 0 14px;
        margin: 20px 0;
      }
      .check-notice {
        background: #fff3df;
        padding: 12px;
        border-radius: 6px;
      }
      .step-shell {
        position: relative;
        margin: 0 auto 24px;
      }
      .step-shell:not(:last-child)::after {
        content: '';
        position: absolute;
        height: 24px;
        width: 2px;
        background: #bfc8c4;
        left: 50%;
        top: 100%;
      }
      .issue-step {
        margin: 0;
        overflow: visible;
        background: #fff;
      }
      .step-shell.is-compact:has(> details:not([open])) {
        width: min(100%, 320px);
      }
      .is-compact > details:not([open]) > summary {
        min-height: 56px;
        justify-content: center;
        padding: 12px 42px;
        text-align: center;
      }
      .is-compact > details:not([open]) .step-heading {
        flex: initial;
      }
      .is-compact > details:not([open]) .step-heading strong {
        font:
          500 19px Georgia,
          serif;
        margin: 0;
      }
      .is-compact > details:not([open]) :is(.step-number, .step-description, .step-label, .step-chevron) {
        display: none;
      }
      .issue-step > summary {
        padding-right: 58px;
      }
      .issue-step.state-completed {
        background: #e3edff;
        border-color: #7da5d8;
      }
      .issue-step:is(.state-skipped, .state-planned-skip) {
        background: #e7e8e6;
        border-color: #babebb;
      }
      .issue-step:is(.state-ready, .state-working) {
        background: #e4f2e8;
        border-color: #6caa85;
      }
      .issue-step.state-blocked {
        background: #fbe8e5;
        border-color: #d18c84;
      }
      .issue-step.is-current {
        border-width: 2px;
        box-shadow: 0 3px 12px #203b3512;
      }
      .is-current.state-blocked .step-label {
        color: #8b3029;
      }
      .state-blocked .next-action {
        background: #fff6f4;
        border-color: #ddb3ad;
      }
      .state-unchecked .next-action {
        background: #f7f8f5;
      }
      .is-current.state-blocked .step-number {
        color: #9c3d34;
      }
      .is-current > summary {
        padding-top: 26px;
        padding-bottom: 26px;
      }
      .step-info-button {
        position: absolute;
        right: 13px;
        top: 14px;
        background: transparent;
        border: 0;
        padding: 3px 6px;
        font-size: 21px;
        line-height: 1;
        color: #465d55;
        border-radius: 50%;
      }
      .step-help {
        inset: auto;
        top: clamp(8px, anchor(bottom), 20vh);
        right: anchor(right);
        width: min(360px, calc(100vw - 32px));
        max-height: 75vh;
        overflow: auto;
        margin: 8px 0;
        border: 1px solid #aebcb5;
        border-radius: 10px;
        padding: 20px;
        color: #203b35;
        background: #fffefa;
        box-shadow: 0 8px 35px #203b3533;
      }
      .step-help::backdrop {
        background: transparent;
      }
      .stage-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        font-size: 12px;
      }
      .stage-legend span {
        padding: 4px 8px;
        border: 1px solid #d7ded4;
        border-radius: 5px;
        background: #fff;
      }
      .stage-legend .legend-completed {
        background: #e3edff;
      }
      .stage-legend .legend-skipped {
        background: #e7e8e6;
      }
      .stage-legend .legend-ready {
        background: #e4f2e8;
      }
      .stage-legend .legend-blocked {
        background: #fbe8e5;
      }
      button:focus-visible {
        outline: 2px solid #285747;
        outline-offset: 3px;
      }

      @media (max-width: 700px) {
        .next-action {
          flex-direction: column;
          align-items: stretch;
        }
        .issue-step > summary {
          gap: 10px;
          padding: 16px;
          flex-wrap: wrap;
        }
        .step-label {
          margin-left: 40px;
          max-width: none;
          text-align: left;
        }
        .step-heading {
          flex-basis: 65%;
        }
        .step-body {
          padding: 16px;
        }
        .layout {
          display: block;
        }
        main {
          padding: 0 16px;
          margin-top: 20px;
        }
        header {
          padding: 14px 16px;
        }
        td,
        th {
          padding: 10px 7px;
        }
        .card {
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="#/queue"><b>Factory</b></a
      ><span>Issue queue</span><small id="connection">Connecting…</small>
    </header>
    <main>
      <div id="error" role="alert"></div>
      <div id="app"></div>
    </main>
    <dialog id="plan">
      <h2 id="plan-title">Implementation plan</h2>
      <p id="plan-path" class="muted"></p>
      <button id="close-plan">Close plan</button>
      <pre id="plan-content" class="prose" style="white-space: pre-wrap; overflow-wrap: anywhere"></pre>
    </dialog>
    <dialog id="confirm">
      <div id="selection"></div>
      <div class="actions"><button id="approve">Confirm</button><button id="cancel">Cancel</button></div>
    </dialog>
    <script>
      let data,
        busy = false,
        selection;
      const $ = (id) => document.getElementById(id);
      const esc = (value) =>
        String(value ?? '').replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]
        );
      const link = (id) =>
        `<a href="#/issue/${encodeURIComponent(id)}">${esc(data.issues.find((i) => i.id === id)?.title || id)}</a>`;
      async function request(path, value) {
        const options =
          value === undefined
            ? {}
            : {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Factory-Action': 'manual' },
                body: JSON.stringify(value),
              };
        const response = await fetch('/api/' + path, options);
        const result = await response.json();
        if (!response.ok) throw Error(result.error);
        return result;
      }
      async function refresh() {
        try {
          const previous = JSON.stringify(data);
          data = await request('queue');
          $('connection').textContent = 'Live local queue · refreshed ' + new Date().toLocaleTimeString();
          if (
            previous !== JSON.stringify(data) &&
            !busy &&
            !$('confirm').open &&
            !$('plan').open &&
            !document.querySelector(':popover-open') &&
            !document.activeElement.matches('input,textarea,select')
          )
            render();
        } catch (e) {
          $('error').textContent = e.message;
          $('connection').textContent = 'Connection needs attention';
        }
      }
      async function act(task) {
        busy = true;
        $('error').textContent = '';
        try {
          await task();
          await refresh();
        } catch (e) {
          $('error').textContent = e.message;
        } finally {
          busy = false;
          if (data) render();
        }
      }
      function actionCard(a, mode = 'all') {
        const integrate =
          mode !== 'work' &&
          mode !== 'history' &&
          a.status === 'completed' &&
          ['implement', 'integrate'].includes(a.kind) &&
          a.merge !== 'none';
        return `<section class="card"><span class="badge">${esc(statusLabel(a.status))}</span><h3>${esc(a.title)}</h3><p>${a.issues.map(link).join(' · ')}</p><p>${esc(a.scope)}</p><p class="muted">${esc(a.reason)}</p><details><summary>Assignment, history and checks</summary>${actionHistory(a)}<p>${esc(a.worker_prompt)}</p><p>Checks: ${esc(a.verification)}</p><p>Integration: ${esc(mergeLabel(a.merge))}</p><p>${a.issues.map(link).join(' · ')}</p><p>Worker result: ${esc(a.evidence || 'No result recorded yet.')}</p></details>${a.status === 'recommended' && mode !== 'integration' && mode !== 'history' ? `<button data-select="${esc(a.id)}" data-kind="launch" ${a.launchBlocked ? 'disabled' : ''}>Start worker</button>${a.launchBlocked ? `<p class="muted">${esc(a.launchBlocked)}</p>` : ''}` : ''}${integrate ? `<button data-select="${esc(a.id)}" data-kind="integrate" ${a.integrationBlocked ? 'disabled' : ''}>Review integration</button>${a.integrationBlocked ? `<p>${esc(a.integrationBlocked)}</p>` : ''}<p class="muted">The worker finished. Integration is a separate decision.</p>` : ''}</section>`;
      }
      function recordedDate(value) {
        return value ? esc(new Date(value).toLocaleString()) : 'Not recorded';
      }
      function actionHistory(action) {
        return `<dl class="action-history"><dt>Recommendation saved</dt><dd>${recordedDate(action.created)}</dd>${action.reserved ? `<dt>Worker requested</dt><dd>${recordedDate(action.reserved)}</dd>` : ''}${action.updated ? `<dt>Last recorded update</dt><dd>${recordedDate(action.updated)}</dd>` : ''}</dl>`;
      }
      function approvals(run) {
        return run.approvals
          .map(
            (p) =>
              `<div class="card">${approvalDetails(p)}${p.method === 'item/tool/requestUserInput' ? p.params.questions.map((q) => `<label>${esc(q.question)}<textarea data-question="${esc(q.id)}" data-request="${esc(p.id)}"></textarea></label>`).join('') + `<button data-answer="${esc(p.id)}" data-run="${esc(run.id)}" data-decision="answers">Send answers</button>` : `<button data-answer="${esc(p.id)}" data-run="${esc(run.id)}" data-decision="allow">Allow this request</button> <button data-answer="${esc(p.id)}" data-run="${esc(run.id)}" data-decision="decline">Decline</button>`}</div>`
          )
          .join('');
      }
      function approvalDetails(request) {
        const paths = permissionPaths(request.params.permissions || {});
        const title =
          request.method === 'item/permissions/requestApproval' ? 'Codex needs file access' : 'Codex needs your input';
        return `<b>${title}</b>${request.params.reason ? `<p>${esc(request.params.reason)}</p>` : ''}${paths.length ? `<p>Files or folders requested:</p><ul>${paths.map((path) => `<li><code>${esc(path)}</code></li>`).join('')}</ul>` : ''}<details><summary>Request details</summary><pre>${esc(JSON.stringify(request.params, null, 2))}</pre></details>`;
      }
      function permissionPaths(value) {
        if (typeof value === 'string') return value.startsWith('/') ? [value] : [];
        if (!value || typeof value !== 'object') return [];
        return [...new Set(Object.values(value).flatMap(permissionPaths))];
      }
      function reviewFileProblems(issue) {
        const run = data.runs.findLast(
          (r) => r.kind === 'coordinator' && r.issueId === issue.id && r.issueState === issue.state
        );
        if (run?.status !== 'blocked' || !run.fileProblems?.length) return '';
        return `<section class="card"><h3>Couldn’t save the review</h3><p>The completed findings and ${run.reviewedEvidence?.length || 0} inspected files have been kept. The work has not been repeated.</p>${run.fileProblems.map((problem) => `<div><p><b>File:</b> <code>${esc(problem.path)}</code></p><p>${esc(problem.reason)}</p><p>${esc(problem.purpose)}</p>${problem.code === 'REVIEW_FILE_SCOPE' ? `<button data-review-file="${esc(problem.path)}" data-file-run="${esc(run.id)}">Use this file and continue review</button><p class="muted">Allows this exact supporting file for this review only.</p>` : '<p>Continue in the same review chat after the named file is available. Codex will request access if it needs it.</p>'}</div>`).join('')}</section>`;
      }
      function chatLink(id) {
        return id ? `<small><a href="codex://threads/${encodeURIComponent(id)}">Open chat in Codex ↗</a></small>` : '';
      }
      function reviewResult(run, interactive) {
        if (run.kind !== 'coordinator' || !run.result || !['completed', 'blocked'].includes(run.status)) return '';
        const recorded = run.status === 'completed';
        const result = run.result;
        const heading = recorded ? 'Worker result recorded' : 'Review result not recorded';
        const stage = recorded
          ? result.next_state
            ? 'The issue advanced to the next stage after its requirements were checked.'
            : 'This review did not advance the issue. The remaining work below still needs to be addressed.'
          : 'The review stopped before recording finished. A completed review response does not mean this stage passed.';
        const next = recorded
          ? 'Use Progress to recommend the next task.'
          : 'Follow the current step’s next-action panel before trying another review; the worker assignment will not be repeated.';
        return `<h3>${heading}</h3><p>${esc(result.summary)}</p><p>${esc(stage)}</p>${interactive && !result.next_state ? `<p>${next}</p>` : ''}${result.remaining?.length ? `<h4>What still needs work</h4><ul>${result.remaining.map((text) => `<li>${esc(text)}</li>`).join('')}</ul>` : ''}<details><summary>Reviewer’s explanation</summary><p class="prose">${esc(result.notes)}</p></details>`;
      }
      function routePreview(run) {
        if (run.kind !== 'evaluation' || !run.result?.routes?.length) return '';
        return routeDetails(run.result.routes, Boolean(run.savedRoutes));
      }
      function routeDetails(routes, saved) {
        if (!routes.length) return '';

        if (state.status === 'skipped')
          return '<p>This step was passed with a recorded reason. Expanding it shows any retained details.</p>';
        if (state.status === 'planned-skip')
          return '<p>The saved plan does not require this step. That can change if new requirements make it necessary.</p>';
        return `<p><b>${state.status === 'completed' ? 'What this step required' : 'To finish this step'}:</b> ${esc(stepFinish[step.role] || step.exit || step.description)}</p>`;
      }
      function stepState(issue, step, actions) {
        if (step.state)
          return (
            issue.stageStates?.[step.state] || {
              status: 'unknown',
              label: 'No outcome recorded',
              summary: 'No outcome has been recorded for this step.',
            }
          );
        if (step.role === 'integration') {
          if (issue.stageStates?.['@integration']) return issue.stageStates['@integration'];
          const integrated = actions.filter((a) => ['implement', 'integrate'].includes(a.kind));
          if (integrated.length && integrated.every((a) => a.status === 'integrated'))
            return {
              status: 'completed',
              label: 'Completed',
              summary: 'The recorded code changes were integrated after their required checks.',
            };
          const planned = [...data.runs]
            .reverse()
            .flatMap((r) => r.savedRoutes || [])
            .find((r) => r.issueId === issue.id)
            ?.steps.find((s) => s.state === '@integration');
          if (planned)
            return {
              status: planned.decision === 'skip' ? 'planned-skip' : 'future',
              label: planned.decision === 'skip' ? 'Planned to skip' : 'Planned',
              summary: planned.reason,
            };
          return {
            status: 'future',
            label: 'Separate manual action',
            summary:
              'Code changes need a separate integration action after the worker finishes. This does not accept or close the issue.',
          };
        }
        return {
          status: 'unknown',
          label: 'Recorded work',
          summary: 'These assignments do not belong to a configured lifecycle step.',
        };
      }
      function stepChatLinks(issue) {
        const relevant = data.runs.filter((r) => r.actionId === issue.progress?.actionId);
        const coordinator = [...relevant].reverse().find((r) => r.kind === 'coordinator' && r.threadId);
        const worker = [...relevant].reverse().find((r) => r.workerThreadId);
        return `<p>${coordinator ? `<a href="codex://threads/${encodeURIComponent(coordinator.threadId)}">Open review chat ↗</a>` : ''}${coordinator && worker ? ' · ' : ''}${worker ? `<a href="codex://threads/${encodeURIComponent(worker.workerThreadId)}">Open original worker chat ↗</a>` : ''}</p>`;
      }
      function readinessExplanation(issue) {
        if (issue.readiness?.status === 'blocked')
          return issue.readiness.summary + ' Use Progress to try again after addressing the problem.';
        return 'Use Progress to try the recommended action. It checks the current work and required permissions as part of that action, and explains anything that prevents it from continuing.';
      }
      function reviewConclusion(summary) {
        const full = summary.trim();
        const lead = full
          .split(/(?<=[.!?])\s+/)
          .slice(0, 2)
          .join(' ');
        return `<p>${esc(lead)}</p>${lead !== full ? `<details><summary>Full conclusion and limits</summary><p class="prose">${esc(full)}</p></details>` : ''}`;
      }
      function latestReviewResult(issue) {
        const result = issue.latestResult;
        if (!result) return '';
        return `<section class="card latest-result" id="latest-review-result"><small>${result.fresh ? 'Result of your last review' : 'Earlier review — information has changed'}</small><h3>Review finished</h3><p><b>${result.recommendations.length ? `${result.recommendations.length} suggested assignment${result.recommendations.length === 1 ? '' : 's'}` : 'No new worker recommended'}</b></p>${reviewConclusion(result.summary)}${result.recommendations.map((a) => `<div class="suggestion"><h4>${esc(a.title)}</h4><p>${esc(a.scope)}</p><p><b>Why:</b> ${esc(a.reason)}</p></div>`).join('')}${routeDetails(result.routes, result.saved)}<h4>What to do next</h4><p>${esc(result.nextStep)}</p>${result.fresh && result.saveProblem ? `<p class="plan-problem"><b>The proposed route cannot be saved:</b> ${esc(result.saveProblem)} Use Progress to check existing work before planning another assignment. This read-only review has not changed the issue.</p>` : ''}${result.saved ? '<p>The recommendation and route were saved. Saving did not start a worker.</p>' : ''}${chatLink(result.threadId)}</section>`;
      }
      function finalControls(issue, role) {
        const closed = role === 'closed';
        return `<section class="next-action"><div><small>${closed ? 'Issue closed' : 'Your decision'}</small><h3>${closed ? 'This issue is closed' : 'Ready for final review'}</h3><p>${closed ? 'You can review the result or reopen the issue if more work is needed.' : 'The work is implemented, checked and committed. Review the result, close the issue if you accept it, or reopen it if more work is needed.'}</p>${humanChecks(issue)}<div class="toolbar">${closed ? '' : `<button class="primary" data-issue-decision="close" data-issue-id="${esc(issue.id)}" data-issue-state="${esc(issue.state)}">Close issue</button>`}<button data-review-result="${esc(issue.id)}">Review result</button><button data-issue-decision="reopen" data-issue-id="${esc(issue.id)}" data-issue-state="${esc(issue.state)}">Reopen issue</button></div></div></section>`;
      }
      let reviewOpenFor = null;
      function reviewRecordedResult(id) {
        reviewOpenFor = id;
        const result = $('recorded-result');
        if (!result) return;
        result.open = true;
        result.scrollIntoView({ block: 'start', behavior: 'smooth' });
        result.querySelector('summary').focus();
      }
      function selectIssueDecision(button) {
        const kind = button.dataset.issueDecision;
        selection = {
          decision: true,
          issueId: button.dataset.issueId,
          state: button.dataset.issueState,
          kind,
          basis: data.reviewBasis,
        };
        $('selection').innerHTML =
          kind === 'close'
            ? '<h2>Close this issue?</h2><p>This accepts the recorded result and closes the issue. You can reopen it later if more work is needed.</p>'
            : '<h2>Reopen this issue?</h2><p>This returns the issue to investigation. The existing result, checks and commits are kept. No worker starts automatically.</p><label>What still needs work? (optional)<textarea id="reopen-reason" maxlength="4000"></textarea></label>';
        $('approve').textContent = kind === 'close' ? 'Accept and close issue' : 'Reopen issue';
        $('approve').disabled = false;
        $('confirm').showModal();
      }
      function progressControls(issue) {
        const role = data.lifecycle.find((s) => s.state === issue.state)?.role;
        if (['ready-to-close', 'closed'].includes(role) && issue.progress.disabled) return finalControls(issue, role);
        if (/UI lost the link/.test(issue.readiness?.summary || ''))
          return `<section class="next-action"><div><h3>Find the existing work</h3><p>The UI lost the link to the Codex chat that worked on this task. It can look it up and restore the link so you can review the finished result.</p><button class="primary" data-find-worker="${esc(issue.id)}" data-worker-state="${esc(issue.state)}">Find existing chat</button></div></section>`;
        const choice = issue.progress;
        if (!choice) return '';
        const r = issue.readiness || { status: 'unchecked' };
        const ready = r.status === 'ready';
        const busy = data.runs.some(
          (run) =>
            run.connected &&
            (run.issueId === issue.id || data.actions.some((a) => a.id === run.actionId && a.issues.includes(issue.id)))
        );
        const title = progressTitle(issue, busy);
        const summary = choice.disabled
          ? choice.summary
          : busy
            ? issue.stageStates[issue.state].summary
            : r.status === 'blocked'
              ? r.summary
              : actionSummary(choice);
        const finished = choice.disabled && issue.latestResult?.fresh;
        return `<section class="next-action"><div><small>${finished ? 'No repeat action' : ready ? 'Ready for the next action' : 'What happens next'}</small><h3>${esc(title)}</h3><p>${esc(summary)}</p>${r.status === 'blocked' ? stepChatLinks(issue) : ''}</div><button class="primary" data-progress-id="${esc(issue.id)}" data-progress-state="${esc(issue.state)}" ${choice.disabled || busy ? 'disabled' : ''}>${r.approvalAvailable ? 'Review required approval' : 'Progress →'}</button></section>`;
      }
      function actionSummary(choice) {
        return (
          {
            review: 'Review the finished result and update this issue.',
            plan: 'Find the next task, or record work already finished.',
            reconcile: 'Check existing work and move through the steps already finished.',
            'save-review': 'Save the proposed work before starting it.',
            launch: 'Start the saved task in a separate Codex chat.',
            integrate: 'Review and bring the finished changes into the project.',
          }[choice.kind] || choice.summary
        );
      }
      function progressTitle(issue, busy) {
        if (busy) return 'Work in progress';
        return issue.progress.title;
      }
      function liveStepWork(issue, stage) {
        return data.runs
          .filter((run) => run.connected && belongsInStage(run, issue, stage, true))
          .map((run) => progress(run, true))
          .join('');
      }
      function stageReviews(issue, stage, current) {
        return data.runs
          .filter(
            (run) =>
              !(current && run.connected) &&
              !(current && run.id === issue.latestResult?.runId) &&
              (run.kind !== 'readiness' || run.connected) &&
              belongsInStage(run, issue, stage, current)
          )
          .slice()
          .reverse()
          .map((run) => progress(run, current))
          .join('');
      }
      function belongsInStage(run, issue, stage, current) {
        const action = data.actions.find((action) => action.id === run.actionId);
        const belongs = run.issueId === issue.id || action?.issues.includes(issue.id);
        if (!belongs) return false;
        if (run.connected) return current;
        if (run.issueId) return run.issueState === stage.state;
        const role = run.kind === 'integration' ? 'integration' : actionRoles[action.kind];
        return role === stage.role;
      }
      function savePreview(choice) {
        const run = data.runs.find((r) => r.id === choice.runId);
        if (!run?.result) return '';
        return `<p class="prose">${esc(run.result.summary)}</p><ul>${run.result.recommendations.map((a) => `<li><b>${esc(a.title)}</b>: ${esc(a.scope)}</li>`).join('')}</ul>${routePreview(run)}`;
      }
      async function selectProgress(id, state) {
        selection = await request('progress-preflight', { issueId: id, state });
        const a = selection.action;
        $('selection').innerHTML =
          `<h2>${esc(selection.choice.title)}</h2><p>${esc(selection.choice.summary)}</p><p>${selection.choice.kind === 'reconcile' ? 'This records steps that are already finished and stops at the first requirement still needing attention. It does not start workers, merge changes or close the issue.' : 'This performs one selected action. Further work needs another click.'}</p>${selection.choice.kind === 'save-review' ? savePreview(selection.choice) + '<p>This records the reviewed recommendation and planned route only. Worker launch, integration and issue acceptance remain separate actions.</p>' : ''}${selection.choice.kind === 'review' ? '<p>The existing review chat will check the finished work and supporting files, then update this issue. It can move the issue forward when that work is complete. It will not restart the worker or close the issue.</p>' : ''}${selection.choice.kind === 'plan' ? '<p>A separate chat will review this issue. If the work already exists, its completed steps will be recorded automatically. New assignments, worker launches and integration remain separate choices.</p>' : ''}${a ? `<h3>${esc(a.title)}</h3><p>${esc(a.scope)}</p><p>Checks: ${esc(a.verification)}</p><p>Integration: ${esc(mergeLabel(a.merge))}</p>` : ''}${selection.diff !== undefined && selection.diff !== null ? `<details><summary>Candidate changes</summary><pre>${esc(selection.diff)}</pre></details><details><summary>Worker evidence</summary><pre>${esc(a.evidence)}</pre></details>` : ''}${selection.requiresApproval ? '<label><input type="checkbox" id="human-approval"> I reviewed and approve this exact candidate for integration.</label>' : ''}`;
        $('approve').textContent = selection.choice.title;
        $('approve').disabled = selection.requiresApproval === true;
        if (selection.requiresApproval)
          $('human-approval').onchange = () => {
            $('approve').disabled = !$('human-approval').checked;
          };
        $('confirm').showModal();
      }
      function recordedResultIndex(sections) {
        const latest = sections.findLastIndex((s) => /^## (Issue progress review|Worker result review)/.test(s));
        if (latest >= 0) return latest;
        return Math.max(
          0,
          sections.findLastIndex((s) => /^## (Evidence and progress|Result|Verification)/.test(s))
        );
      }
      function issueNotes(i) {
        const text = i.content.replace(/^---[\s\S]*?---\s*/, '');
        const sections = text.split(/(?=^## )/m).filter((section) => section.trim());
        const resultIndex = recordedResultIndex(sections);
        return `<section class="card"><h2>Recorded issue notes</h2><p class="muted">Notes are shown in the order they appear in the issue report.</p>${sections
          .map((section, index) => {
            const match = section.match(/^## ([^\n]+)\n([\s\S]*)/);
            return `<details ${index === resultIndex ? `id="recorded-result" ${reviewOpenFor === i.id ? 'open' : ''}` : ''}><summary tabindex="-1">${esc(match ? match[1] : 'Issue description')}</summary><div class="prose">${reportText(match ? match[2] : section)}</div></details>`;
          })
          .join('')}</section>`;
      }
      function issue(id) {
        const i = data.issues.find((x) => x.id === id);
        if (!i) return '<h1>Issue not found</h1><a href="#/queue">Back to queue</a>';
        const actions = data.actions.filter((a) => a.issues.includes(id));
        return `<a href="#/queue">← Issue queue</a><div class="issue-title"><h1>${esc(i.title || i.id)}</h1><span class="badge">${esc(i.stage)}</span></div><p class="muted">${esc(i.id)}</p><div class="layout"><div><div class="lifecycle-heading"><h2>Issue lifecycle</h2><p class="muted">Open any step to see its assignments, results and checks. The current step comes from the issue report. Colour shows its recorded state.</p><p class="stage-legend"><span class="legend-completed">Completed</span><span class="legend-skipped">Skipped / planned skip</span><span class="legend-ready">Ready / working</span><span class="legend-blocked">Blocked</span><span>Future / not checked</span></p></div><div class="issue-steps">${issueSteps(i, actions)}</div>${issueNotes(i)}</div><aside><section class="card"><h2>Your input</h2><p>${inputStatus(i)}</p>${humanChecks(i)}${i.human_input ? `<details><summary>Recorded requests and answers</summary><pre>${esc(JSON.stringify(i.human_input, null, 2))}</pre></details>` : ''}<p class="muted">Use the buttons in the current step to review, close or reopen the issue.</p></section><section class="card"><h2>Linked issues</h2>${relations(i)}</section></aside></div>`;
      }
      function render() {
        const route = location.hash.split('/');
        $('app').innerHTML = route[1] === 'issue' ? issue(decodeURIComponent(route.slice(2).join('/'))) : queue();
        bind();
      }
      async function findExistingWorker(button) {
        const issueId = button.dataset.findWorker,
          state = button.dataset.workerState;
        const found = await request('find-worker', { issueId, state, basis: data.reviewBasis });
        if (found.connected) return;
        selection = { connection: true, issueId, state, basis: found.basis };
        $('selection').innerHTML =
          `<h2>Connect the chat that did this task</h2><p>Choose its Codex chat below, or paste a Codex chat link. This keeps the existing work and does not start another worker.</p>${found.candidates.length ? `<label>Matching chats<select id="worker-choice"><option value="">Choose a chat</option>${found.candidates.map((t) => `<option value="${esc(t.id)}">${esc(t.title)}</option>`).join('')}</select></label>` : '<p>No matching chat was found automatically.</p>'}<label>Codex chat link<input id="worker-link" placeholder="codex://threads/…"></label>`;
        $('approve').textContent = 'Connect this chat';
        $('approve').disabled = false;
        $('confirm').showModal();
      }
      function bind() {
        document.querySelectorAll('[data-review-file]').forEach(
          (button) =>
            (button.onclick = () =>
              act(() =>
                request('approve-review-file', {
                  runId: button.dataset.fileRun,
                  path: button.dataset.reviewFile,
                  basis: data.reviewBasis,
                })
              ))
        );
        document
          .querySelectorAll('[data-skip-check]')
          .forEach((button) => (button.onclick = () => selectCheckSkip(button, false)));
        document
          .querySelectorAll('[data-skip-all]')
          .forEach((button) => (button.onclick = () => selectCheckSkip(button, true)));
        if ($('implementation-plan'))
          $('implementation-plan').onchange = () => {
            const issue = data.issues.find(
              (i) => i.id === document.querySelector('[data-check-plan]').dataset.checkPlan
            );
            document.querySelector('[data-check-plan]').disabled =
              issue.implementation.running ||
              (!issue.implementation.canCheck && $('implementation-plan').value === issue.implementation.path);
          };
        document.querySelectorAll('[data-check-plan]').forEach((button) => {
          button.onclick = () =>
            act(() => {
              const issue = data.issues.find((i) => i.id === button.dataset.checkPlan);
              return request('check-implementation', {
                issueId: issue.id,
                state: issue.state,
                path: $('implementation-plan')?.value || issue.implementation.path,
                basis: data.reviewBasis,
              });
            });
        });
        document
          .querySelectorAll('[data-plan-step]')
          .forEach((step) => (step.ontoggle = () => expandedChecks.set(step.dataset.planStep, step.open)));
        document
          .querySelectorAll('[data-check-evidence]')
          .forEach((button) => (button.onclick = () => act(() => openCheckEvidence(button))));
        document
          .querySelectorAll('[data-plan-decision]')
          .forEach((button) => (button.onclick = () => selectPlanDecision(button)));
        document.querySelectorAll('[data-open-plan]').forEach((button) => {
          button.onclick = () => act(() => openPlan(button.dataset.openPlan));
        });
        document.querySelectorAll('[data-find-worker]').forEach((button) => {
          button.onclick = () => act(() => findExistingWorker(button));
        });
        document.querySelectorAll('[data-review-result]').forEach((button) => {
          button.onclick = () => reviewRecordedResult(button.dataset.reviewResult);
        });
        document.querySelectorAll('[data-issue-decision]').forEach((button) => {
          button.onclick = () => selectIssueDecision(button);
        });
        document
          .querySelectorAll('[data-progress-id]')
          .forEach(
            (button) =>
              (button.onclick = () =>
                act(() => selectProgress(button.dataset.progressId, button.dataset.progressState)))
          );
        document
          .querySelectorAll('[data-step-id]')
          .forEach((step) => (step.ontoggle = () => expandedSteps.set(step.dataset.stepId, step.open)));
        document
          .querySelectorAll('[data-select]')
          .forEach((b) => (b.onclick = () => act(() => select(b.dataset.select, b.dataset.kind))));
        document
          .querySelectorAll('[data-save]')
          .forEach(
            (b) =>
              (b.onclick = () => act(() => request('save-review', { runId: b.dataset.save, basis: data.reviewBasis })))
          );
        document
          .querySelectorAll('[data-resume]')
          .forEach(
            (b) =>
              (b.onclick = () =>
                act(() => request('resume', { runId: b.dataset.resume, text: $('resume-' + b.dataset.resume).value })))
          );
        document.querySelectorAll('[data-answer]').forEach((b) => (b.onclick = () => act(() => answer(b))));
        if ($('review'))
          $('review').onclick = () =>
            act(async () => {
              selection = { review: true, basis: data.reviewBasis };
              $('selection').innerHTML =
                '<h2>Review the queue?</h2><p>Codex will read the issues and suggest assignments. This starts a read-only chat. It does not save recommendations, start workers or integrate changes.</p>';
              $('approve').textContent = 'Start queue review';
              $('approve').disabled = false;
              $('confirm').showModal();
            });
        if ($('search')) {
          const filter = () => {
            $('issues').innerHTML = rows(
              data.issues.filter(
                (i) =>
                  (!$('stage').value || i.state === $('stage').value) &&
                  JSON.stringify(i).toLowerCase().includes($('search').value.toLowerCase())
              )
            );
          };
          $('search').oninput = filter;
          $('stage').onchange = filter;
        }
      }
      async function select(actionId, kind) {
        selection = await request('preflight', { actionId, kind });
        const a = selection.action;
        $('selection').innerHTML =
          `<h2>${kind === 'launch' ? 'Start this worker?' : 'Integrate these changes?'}</h2><h3>${esc(a.title)}</h3><p>${a.issues.map(link).join(' · ')}</p><p>${esc(a.scope)}</p><p>Checks: ${esc(a.verification)}</p><p>Integration policy: ${esc(mergeLabel(a.merge))}</p><p>Target: ${esc(data.root)}</p><p>Current revision: ${esc(selection.head)}</p>${kind === 'integrate' ? `<p>Candidate: ${esc(a.worker_revision)}</p><details><summary>Review candidate changes</summary><pre>${esc(selection.diff)}</pre></details><details><summary>Worker evidence</summary><pre>${esc(a.evidence)}</pre></details><p>A separate coordinator chat will integrate this candidate and run the required checks. A failed check stops completion and keeps the result for review.</p>` : '<p>Codex starts one chat in a separate checkout. No other workers or integrations start automatically.</p>'}<details><summary>Human input reviewed for this action</summary><pre>${esc(JSON.stringify(selection.guards, null, 2))}</pre></details>${selection.requiresApproval ? '<label><input type="checkbox" id="human-approval"> I reviewed and approve this exact candidate for integration.</label>' : ''}`;
        $('approve').textContent = kind === 'launch' ? 'Start worker' : 'Start integration';
        $('approve').disabled = selection.requiresApproval;
        if (selection.requiresApproval)
          $('human-approval').onchange = () => {
            $('approve').disabled = !$('human-approval').checked;
          };
        $('confirm').showModal();
      }
      async function answer(button) {
        const response = { decision: button.dataset.decision };
        if (response.decision === 'answers') {
          response.answers = {};
          document.querySelectorAll('[data-question]').forEach((q) => {
            if (q.dataset.request === button.dataset.answer) response.answers[q.dataset.question] = q.value;
          });
        }
        await request('answer', { runId: button.dataset.run, requestId: button.dataset.answer, response });
      }
      $('close-plan').onclick = () => $('plan').close();
      $('cancel').onclick = () => $('confirm').close();
      $('approve').onclick = () =>
        act(async () => {
          if (selection.planSkip)
            await request('skip-plan-checks', { ...selection, reason: $('skip-check-reason').value });
          else if (selection.planDecision)
            await request('plan-decision', { ...selection, result: $('plan-decision-result').value });
          else if (selection.connection)
            await request('connect-worker', {
              ...selection,
              link: $('worker-link').value || $('worker-choice')?.value || '',
            });
          else if (selection.decision)
            await request('issue-decision', { ...selection, reason: $('reopen-reason')?.value || '' });
          else if (selection.progress)
            await request('progress-start', {
              token: selection.token,
              humanApproved: $('human-approval')?.checked === true,
            });
          else if (selection.review) await request('evaluate', { basis: selection.basis });
          else await request('start', { token: selection.token, humanApproved: $('human-approval')?.checked === true });
          $('confirm').close();
        });
      window.onhashchange = () => {
        if (data) render();
        window.scrollTo(0, 0);
      };
      refresh();
      setInterval(refresh, 4000);
    </script>
  </body>
</html>
