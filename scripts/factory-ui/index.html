<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Factory · Issue queue</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font:
          15px/1.5 system-ui,
          sans-serif;
        background: #f4f3ed;
        color: #203b35;
      }
      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }
      h1 {
        font:
          500 clamp(30px, 4vw, 43px) / 1.15 Georgia,
          serif;
        letter-spacing: -0.7px;
      }
      h2 {
        font:
          500 25px/1.2 Georgia,
          serif;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      a {
        text-underline-offset: 3px;
      }
      button:hover:not(:disabled) {
        filter: brightness(0.95);
      }
      .live-output {
        background: #17211e;
        color: #e5eee9;
        border-radius: 8px;
        padding: 12px;
        height: 300px;
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font:
          12px/1.5 ui-monospace,
          SFMono-Regular,
          monospace;
        text-align: left;
      }
      .activity-toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin: 12px 0 6px;
      }
      .activity-toolbar strong {
        margin-right: auto;
      }
      .permission-choice {
        margin-top: 10px;
      }
      .permission-choice code {
        display: block;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font-size: 12px;
        margin: 6px 0;
      }
      .discussion {
        margin: 22px 0 30px;
      }
      .discussion .discussion-toggle {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 0;
        border-radius: 0;
        box-shadow: none;
        background: transparent;
        padding: 6px 0;
        color: #243f39;
        font: inherit;
        font-weight: 600;
      }
      .discussion-toggle::before {
        content: '▸';
      }
      .discussion-toggle[aria-expanded='true']::before {
        content: '▾';
      }
      .discussion-output {
        height: 260px;
        overflow: auto;
        border: 1px solid #d7d9cd;
        border-radius: 6px 6px 0 0;
        background: #fffefa;
        padding: 16px 18px;
        line-height: 1.6;
      }
      .discussion-output p {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .discussion-output strong {
        display: block;
        font-size: 12px;
        color: #758071;
      }
      .discussion-compose {
        position: relative;
        margin: 0;
      }
      .discussion-compose textarea {
        display: block;
        box-sizing: border-box;
        width: 100%;
        min-height: 84px;
        margin: 0;
        padding: 12px 60px 14px 18px;
        border: 1px solid #d7d9cd;
        border-top: 0;
        border-radius: 0 0 6px 6px;
        resize: vertical;
        background: #fffefa;
      }
      .discussion .discussion-send {
        position: absolute;
        right: 12px;
        bottom: 12px;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        width: 34px;
        height: 34px;
        margin: 0;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: #243f39;
        color: white;
        line-height: 1;
      }
      .discussion-send svg {
        display: block;
        width: 19px;
        height: 19px;
      }
      .discussion-status:empty {
        display: none;
      }
      .discussion-info {
        font-size: 12px;
        color: #758071;
        margin: 7px 0 0;
      }
      .discussion-info summary {
        cursor: pointer;
      }
      .discussion-preview pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      @media (max-width: 600px) {
        .discussion-output {
          height: 230px;
        }
      }
    </style>
    <style>
      body {
        margin: 0;
      }
      main {
        max-width: 1200px;
        margin: 32px auto;
        padding: 0 24px;
      }

  <body>
    <header>
      <a href="#/queue"><b>Factory</b></a
      ><span>Issue queue</span><small id="connection">Connecting…</small>
    </header>
    <main>
      <div id="error" role="alert"></div>
      <div id="app"></div>
    </main>
    <dialog id="plan">
      <h2 id="plan-title">Implementation plan</h2>
      <p id="plan-path" class="muted"></p>
      <button id="close-plan">Close plan</button>
      <pre id="plan-content" class="prose" style="white-space: pre-wrap; overflow-wrap: anywhere"></pre>
    </dialog>
    <dialog id="confirm">
      <div id="selection"></div>
      <p id="confirmation-error" role="alert"></p>
      <div class="actions"><button id="approve">Confirm</button><button id="cancel">Cancel</button></div>
    </dialog>
    <script src="/discussion-ui.js"></script>
    <script src="/site-review-ui.js"></script>
    <script>
      let data,
        busy = false,
        selection;
      let refreshing = false,
        refreshPending = false;
      const runDetails = new Map();
      const approvalStates = new Map();
      const $ = (id) => document.getElementById(id);
      const esc = (value) =>
        String(value ?? '').replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]
        );
      const link = (id) =>
        `<a href="#/issue/${encodeURIComponent(id)}">${esc(data.issues.find((i) => i.id === id)?.title || id)}</a>`;
      async function request(path, value) {
        const options =
          value === undefined
            ? {}
            : {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Factory-Action': 'manual' },
                body: JSON.stringify(value),
              };
        const response = await fetch('/api/' + path, options);
        const result = await response.json();
        if (!response.ok) throw Error(result.error);
        return result;
      }
      async function refresh() {
        if (refreshing) return;
        refreshing = true;
        try {
          const previous = JSON.stringify(data);
          const issueId = location.hash.match(/^#\/issue\/([^/]+)/)?.[1] || '';
          const [snapshot, runtime] = await Promise.all([
            request('queue?issue=' + encodeURIComponent(issueId)),
            request('runtime'),
          ]);
          data = snapshot;
          showRuntime(runtime);
          $('connection').textContent = 'Live local queue · refreshed ' + new Date().toLocaleTimeString();
          updateLiveOutput();
          refreshPending ||= previous !== JSON.stringify(data);
          if (
            refreshPending &&
            !busy &&
            !$('confirm').open &&
            !$('plan').open &&
            !document.querySelector(':popover-open') &&
            (!document.activeElement.matches('input,textarea,select') ||
              document.activeElement.closest('[data-temporary]'))
          ) {
            render();
            refreshPending = false;
          }
        } catch (e) {
          $('error').textContent = e.message;
          $('connection').textContent = 'Connection needs attention';
        } finally {
          refreshing = false;
        }
      }
      function showRuntime(runtime) {
        let status = $('runtime');
        if (!status) {
          status = document.createElement('small');
          status.id = 'runtime';
          document.querySelector('header').append(status);
        }
        status.textContent =
          runtime.mode === 'preview' ? 'Preview copy — approvals belong on the real issue' : 'Live factory';
        status.title =
          'Issue queue: ' + runtime.project + '\nUI source: ' + runtime.checkout + '\nRevision: ' + runtime.revision;
        if (runtime.mode === 'preview' && runtime.authoritativeUrl) {
          const url = new URL(runtime.authoritativeUrl);
          if (['http:', 'https:'].includes(url.protocol)) {
            const link = document.createElement('a');
            link.href = url.origin + '/' + location.hash;
            link.textContent = ' Open real issue';
            status.append(link);
          }
        }
      }
      async function act(task) {
        busy = true;
        $('confirmation-error').textContent = '';
        if ($('confirm').open) $('approve').disabled = true;
        $('error').textContent = '';
        try {
          await task();
          await refresh();
        } catch (e) {
          $('error').textContent = e.message;
          if ($('confirm').open) $('confirmation-error').textContent = e.message;
        } finally {
          if ($('confirm').open) $('approve').disabled = false;
          busy = false;
          if (data) render();
        }
      }
      function approvalKey(button) {
        if (button.id === 'approve') return 'dialog';
        return [
          button.dataset.run,
          button.dataset.answer,
          button.dataset.lifecycleAnswer,
          button.dataset.lifecycleUpdated,
          button.dataset.decision,
        ].join(':');
      }

        return `<p class="muted" data-live-health="${esc(run.id)}">${esc(phase + status + ' ' + activity)}${run.health?.checkedAt ? ' Status checked: ' + recordedDate(run.health.checkedAt) + '.' : ''}</p>`;
      }
      function activityText(issue) {
        return data.runs
          .filter(
            (run) =>
              run.issueId === issue.id ||
              data.actions.some((action) => action.id === run.actionId && action.issues.includes(issue.id))
          )
          .flatMap((run) =>
            (run.output || []).map((line) => {
              const time = line.at ? new Date(line.at).toLocaleTimeString() : '';
              const command = line.command ? '$ ' + line.command + '\n' : '';
              const outcome = line.exitCode !== undefined ? '\nExit ' + line.exitCode : '';
              const status = line.status === 'inProgress' ? 'running' : line.status;
              return '[' + time + '] ' + (status ? '[' + status + '] ' : '') + command + line.text + outcome;
            })
          )
          .join('\n\n');
      }
      function lifecycleActivity(issue) {
        return `<div class="activity-toolbar"><strong>Live output</strong><button data-follow-output>Follow latest</button><button data-copy-output>Copy output</button></div><pre class="live-output" id="live-output" tabindex="0" aria-label="Live output for this issue">${esc(activityText(issue) || 'No output recorded yet.')}</pre><p class="muted">Recent output is kept for each chat. Scroll up to read; Follow latest returns to new output.</p>`;
      }
      function lifecycleInput(issue, record) {
        const input = record.input;
        const common = `data-lifecycle-answer="${esc(issue.id)}" data-lifecycle-updated="${esc(record.updated)}"`;
        const draftKey =
          issue.id +
          ':' +
          input.type +
          ':' +
          (input.reportHash || input.plan?.sha256 || input.question || input.request?.source_key || 'answer');
        const textarea = `<label>Your answer<textarea id="lifecycle-answer-${esc(issue.id)}" data-draft-key="${esc(draftKey)}" rows="4">${esc(lifecycleDrafts.get(draftKey) || '')}</textarea></label>`;
        const approve = `<button class="primary" ${common} data-decision="approve">${input.type === 'integration' ? 'Approve these changes and continue' : 'Approve plan and continue'}</button>`;
        if (input.type === 'plan')
          return `<p>${esc(input.plan.summary)}</p><details open><summary>Implementation plan · ${esc(input.plan.path || 'Proposed plan')}</summary><pre class="prose" style="white-space:pre-wrap">${esc(input.plan.content)}</pre></details>${approve}<details><summary>Request changes</summary>${textarea}<button ${common} data-decision="changes">Send requested changes</button></details>`;
        if (input.type === 'integration')
          return `<p>Candidate <code>${esc(input.candidate)}</code> will be added to revision <code>${esc(input.target)}</code>. This plan requires your review before integration.</p><details><summary>Review the changes</summary><pre>${esc(input.diff)}</pre></details>${approve}`;
        if (!['questions', 'worker', 'human', 'scope'].includes(input.type)) return '';
        const question =
          input.type === 'questions'
            ? input.questions
                .map(
                  (q) =>
                    `<p><strong>${esc(q.question)}</strong></p>${q.why && q.why !== record.summary ? `<p>${esc(q.why)}</p>` : ''}${q.expected ? `<p>${esc(q.expected)}</p>` : ''}`
                )
                .join('')
            : input.request?.prompt === record.summary || input.question === record.summary
              ? ''
              : `<p>${esc(input.request?.prompt || input.question)}</p>`;
        return `${question}${input.request?.expected ? `<p>${esc(input.request.expected)}</p>` : ''}${textarea}<button class="primary" ${common} data-decision="${input.type === 'human' ? 'approve' : 'answer'}">Send answer and continue</button>`;
      }
      function liveStepWork(issue, stage) {
        return data.runs
          .filter(
            (run) => run.connected && run.id !== issue.lifecycle?.childRunId && belongsInStage(run, issue, stage, true)
          )
          .map((run) => progress(run, true))
          .join('');
      }
      function stageReviews(issue, stage, current) {
        return data.runs
          .filter(
            (run) =>
              !(current && run.connected) &&
              !(current && run.id === issue.latestResult?.runId) &&
              (run.kind !== 'readiness' || run.connected) &&
              belongsInStage(run, issue, stage, current)
          )
          .slice()
          .reverse()
          .map((run) => progress(run, current))
          .join('');
      }
      function belongsInStage(run, issue, stage, current) {
        const action = data.actions.find((action) => action.id === run.actionId);
        const belongs = run.issueId === issue.id || action?.issues.includes(issue.id);
        if (!belongs) return false;
        if (run.connected) return current;
        if (run.issueId) return run.issueState === stage.state;
        const role = run.kind === 'integration' ? 'integration' : actionRoles[action.kind];
        return role === stage.role;
      }
      function recordedResultIndex(sections) {
        const latest = sections.findLastIndex((s) => /^## (Issue progress review|Worker result review)/.test(s));
        if (latest >= 0) return latest;
        return Math.max(
          0,
          sections.findLastIndex((s) => /^## (Evidence and progress|Result|Verification)/.test(s))
        );
      }
      function issueNotes(i) {
        const text = i.content.replace(/^---[\s\S]*?---\s*/, '');
        const sections = text.split(/(?=^## )/m).filter((section) => section.trim());
        const resultIndex = recordedResultIndex(sections);
        return `<section class="card"><h2>Recorded issue notes</h2><p class="muted">Notes are shown in the order they appear in the issue report.</p>${sections
          .map((section, index) => {
            const match = section.match(/^## ([^\n]+)\n([\s\S]*)/);
            return `<details ${index === resultIndex ? `id="recorded-result" ${reviewOpenFor === i.id ? 'open' : ''}` : ''}><summary tabindex="-1">${esc(match ? match[1] : 'Issue description')}</summary><div class="prose">${reportText(match ? match[2] : section)}</div></details>`;
          })
          .join('')}</section>`;
      }
      function issue(id) {
        const i = data.issues.find((x) => x.id === id);
        if (!i) return '<h1>Issue not found</h1><a href="#/queue">Back to queue</a>';
        const actions = data.actions.filter((a) => a.issues.includes(id));
        return `<a href="#/queue">← Issue queue</a><div class="issue-title"><h1>${esc(i.title || i.id)}</h1><span class="badge">${esc(i.stage)}</span></div><p class="muted">${esc(i.id)}</p><div id="discussion-slot"></div><div class="layout"><div><div class="lifecycle-heading"><h2>Issue lifecycle</h2>${lifecyclePanel(i)}<p class="muted">Open any step to see its assignments, results and checks. The current step comes from the issue report. Colour shows its recorded state.</p><p class="stage-legend"><span class="legend-completed">Completed</span><span class="legend-skipped">Skipped / planned skip</span><span class="legend-ready">Ready / working</span><span class="legend-blocked">Blocked</span><span>Future / not checked</span></p></div><div class="issue-steps">${issueSteps(i, actions)}</div>${issueNotes(i)}</div><aside><section class="card"><h2>Your input</h2><p>${inputStatus(i)}</p>${humanChecks(i)}${i.human_input ? `<details><summary>Recorded requests and answers</summary><pre>${esc(JSON.stringify(i.human_input, null, 2))}</pre></details>` : ''}<p class="muted">Answer any question above to continue. Final review has buttons to review, close or reopen the issue.</p></section><section class="card"><h2>Linked issues</h2>${relations(i)}</section></aside></div>`;
      }
      const viewMemory = {
        route: null,
        expanded: loadExpanded(),
        fields: new Map(),
        positions: new Map(),
        logs: new Map(),
        focus: null,
      };
      function loadExpanded() {
        try {
          return JSON.parse(localStorage.getItem('factory-expanded-v2') || '{}');
        } catch {
          return {};
        }
      }
      function detailKey(element) {
        const owner = element.closest('[data-view-id],[data-step-id],[data-plan-step]');
        const names = [];
        for (let node = element; node && node !== owner; node = node.parentElement) {
          if (node.tagName === 'DETAILS')
            names.unshift(node.querySelector(':scope > summary')?.textContent.trim() || 'Details');
        }
        const group =
          owner?.dataset.viewId ||
          owner?.dataset.stepId ||
          owner?.dataset.planStep ||
          element.closest('section')?.querySelector('h2,h3')?.textContent ||
          'page';
        return location.hash + '|' + group + '|' + names.join('|');
      }
      function rememberView() {
        if (!viewMemory.route) return;
        document.querySelectorAll('#app details:not([data-temporary] *)').forEach((element) => {
          if (element.dataset.viewTouched === 'true') viewMemory.expanded[element.dataset.viewKey] = element.open;
        });
        document
          .querySelectorAll('#app textarea:not([data-temporary] *),#app input:not([data-temporary] *)')
          .forEach((field) => {
            if (field.id && !['checkbox', 'radio'].includes(field.type))
              viewMemory.fields.set(viewMemory.route + '|' + (field.dataset.draftKey || field.id), field.value);
          });
        viewMemory.positions.set(viewMemory.route, window.scrollY);
        const active = document.activeElement;
        const focused = active?.closest('[data-temporary]') ? null : active;
        viewMemory.focus = focused?.id
          ? { route: viewMemory.route, id: focused.id, start: focused.selectionStart, end: focused.selectionEnd }
          : null;
        rememberOutput();
        try {
          localStorage.setItem('factory-expanded-v2', JSON.stringify(viewMemory.expanded));
        } catch {}
      }
      function restoreView() {
        viewMemory.route = location.hash;
        document.querySelectorAll('#app details:not([data-temporary] *)').forEach((element) => {
          const key = detailKey(element);
          element.dataset.viewKey = key;
          if (Object.hasOwn(viewMemory.expanded, key)) element.open = viewMemory.expanded[key];
          element.dataset.viewTouched = Object.hasOwn(viewMemory.expanded, key) ? 'true' : 'false';
          element.querySelector(':scope > summary')?.addEventListener('click', () => {
            element.dataset.viewTouched = 'true';
          });
          element.addEventListener('toggle', () => {
            if (element.dataset.viewTouched !== 'true') return;
            viewMemory.expanded[key] = element.open;
            try {
              localStorage.setItem('factory-expanded-v2', JSON.stringify(viewMemory.expanded));
            } catch {}
          });
        });
        document
          .querySelectorAll('#app textarea:not([data-temporary] *),#app input:not([data-temporary] *)')
          .forEach((field) => {
            const saved = viewMemory.fields.get(location.hash + '|' + (field.dataset.draftKey || field.id));
            if (saved !== undefined) field.value = saved;
          });
        const focus = viewMemory.focus;
        if (focus?.route === location.hash && $(focus.id)) {
          $(focus.id).focus({ preventScroll: true });
          if (focus.start !== null) $(focus.id).setSelectionRange(focus.start, focus.end);
        }
        window.scrollTo(0, viewMemory.positions.get(location.hash) || 0);
        bindOutput();
      }
      function rememberOutput() {
        const output = $('live-output');
        if (output)
          viewMemory.logs.set(viewMemory.route, {
            top: output.scrollTop,
            follow: output.scrollHeight - output.scrollTop - output.clientHeight < 32,
          });
      }
      function bindOutput() {
        const output = $('live-output');
        if (!output) return;
        const saved = viewMemory.logs.get(location.hash) || { follow: true, top: 0 };
        output.scrollTop = saved.follow ? output.scrollHeight : saved.top;
        output.onscroll = rememberOutput;
        document.querySelector('[data-follow-output]').onclick = () => {
          output.scrollTop = output.scrollHeight;
          viewMemory.logs.set(location.hash, { top: output.scrollTop, follow: true });
        };
        document.querySelector('[data-copy-output]').onclick = async (event) => {
          try {
            await navigator.clipboard.writeText(output.textContent);
            event.target.textContent = 'Copied';
          } catch {
            event.target.textContent = 'Select output to copy';
          }
        };
      }
      function updateLiveOutput() {
        const output = $('live-output'),
          issueId = location.hash.split('/').slice(2).join('/');
        const issue = data?.issues.find((item) => item.id === issueId);
        if (!output || !issue) return;
        for (const element of document.querySelectorAll('[data-live-health]')) {
          const run = data.runs.find((r) => r.id === element.dataset.liveHealth);
          element.outerHTML = liveHealth(run);
        }
        rememberOutput();
        const saved = viewMemory.logs.get(location.hash);
        const text = activityText(issue) || 'No output recorded yet.';
        if (output.textContent !== text) output.textContent = text;
        output.scrollTop = saved?.follow ? output.scrollHeight : saved?.top || 0;
      }
      function render() {
        rememberView();
        const route = location.hash.split('/');
        $('app').innerHTML = route[1] === 'issue' ? issue(decodeURIComponent(route.slice(2).join('/'))) : queue();
        bind();
        applyApprovalFeedback();
        siteReviewUI.mount(data, request, refresh);
        restoreView();
        discussionUI.mount(route[1] === 'issue' ? decodeURIComponent(route.slice(2).join('/')) : null, request);
        document.querySelectorAll('[data-grill-stage]').forEach((button) => {
          button.onclick = () => {
            const stage = data.lifecycle.find((stage) => stage.state === button.dataset.grillStage);
            const extra = { '@integration': 'Integrate', '@other': 'Other work' };
            discussionUI.grill(stage || { state: button.dataset.grillStage, name: extra[button.dataset.grillStage] });
          };
        });
      }
      async function findExistingWorker(button) {
        const issueId = button.dataset.findWorker,
          state = button.dataset.workerState;
        const found = await request('find-worker', { issueId, state, basis: data.reviewBasis });
        if (found.connected) return;
        selection = { connection: true, issueId, state, basis: found.basis };
        $('selection').innerHTML =
          `<h2>Connect the chat that did this task</h2><p>Choose its Codex chat below, or paste a Codex chat link. This keeps the existing work and does not start another worker.</p>${found.candidates.length ? `<label>Matching chats<select id="worker-choice"><option value="">Choose a chat</option>${found.candidates.map((t) => `<option value="${esc(t.id)}">${esc(t.title)}</option>`).join('')}</select></label>` : '<p>No matching chat was found automatically.</p>'}<label>Codex chat link<input id="worker-link" placeholder="codex://threads/…"></label>`;
        $('approve').textContent = 'Connect this chat';
        $('approve').disabled = false;
        $('confirm').showModal();
      }
      function bind() {
        document.querySelectorAll('[data-review-file]').forEach(
          (button) =>
            (button.onclick = () =>
              act(() =>
                request('approve-review-file', {
                  runId: button.dataset.fileRun,
                  path: button.dataset.reviewFile,
                  basis: data.reviewBasis,
                })
              ))
        );
        document
          .querySelectorAll('[data-skip-check]')
          .forEach((button) => (button.onclick = () => selectCheckSkip(button, false)));
        document
          .querySelectorAll('[data-skip-all]')
          .forEach((button) => (button.onclick = () => selectCheckSkip(button, true)));
        if ($('implementation-plan'))
          $('implementation-plan').onchange = () => {
            const issue = data.issues.find(
              (i) => i.id === document.querySelector('[data-check-plan]').dataset.checkPlan
            );
            document.querySelector('[data-check-plan]').disabled =
              issue.implementation.running ||
              (!issue.implementation.canCheck && $('implementation-plan').value === issue.implementation.path);
          };
        document.querySelectorAll('[data-check-plan]').forEach((button) => {
          button.onclick = () =>
            act(() => {
              const issue = data.issues.find((i) => i.id === button.dataset.checkPlan);
              return request('check-implementation', {
                issueId: issue.id,
                state: issue.state,
                path: $('implementation-plan')?.value || issue.implementation.path,
                basis: data.reviewBasis,
              });
            });
        });
        document
          .querySelectorAll('[data-check-evidence]')
          .forEach((button) => (button.onclick = () => act(() => openCheckEvidence(button))));
        document
          .querySelectorAll('[data-plan-decision]')
          .forEach((button) => (button.onclick = () => selectPlanDecision(button)));
        document.querySelectorAll('[data-open-plan]').forEach((button) => {
          button.onclick = () => act(() => openPlan(button.dataset.openPlan));
        });
        document.querySelectorAll('[data-find-worker]').forEach((button) => {
          button.onclick = () => act(() => findExistingWorker(button));
        });
        document.querySelectorAll('[data-review-result]').forEach((button) => {
          button.onclick = () => reviewRecordedResult(button.dataset.reviewResult);
        });
        document.querySelectorAll('[data-issue-decision]').forEach((button) => {
          button.onclick = () => selectIssueDecision(button);
        });
        document.querySelectorAll('[data-lifecycle-start]').forEach((button) => {
          button.onclick = () =>
            act(() =>
              request('lifecycle-start', {
                issueId: button.dataset.lifecycleStart,
                issueBasis: data.issues.find((i) => i.id === button.dataset.lifecycleStart).progressBasis,
                state: data.issues.find((i) => i.id === button.dataset.lifecycleStart).state,
                basis: data.reviewBasis,
              })
            );
        });
        document.querySelectorAll('[id^=lifecycle-answer-]').forEach((field) => {
          field.oninput = () => lifecycleDrafts.set(field.dataset.draftKey, field.value);
        });
        document.querySelectorAll('[data-lifecycle-answer]').forEach((button) => {
          button.onclick = () =>
            submitApproval(button, () =>
              request('lifecycle-answer', {
                issueId: button.dataset.lifecycleAnswer,
                updated: button.dataset.lifecycleUpdated,
                decision: button.dataset.decision,
                text: $('lifecycle-answer-' + button.dataset.lifecycleAnswer)?.value || '',
              })
            );
        });
        document.querySelectorAll('[data-lifecycle-pause]').forEach((button) => {
          button.onclick = () => act(() => request('lifecycle-pause', { issueId: button.dataset.lifecyclePause }));
        });
        document
          .querySelectorAll('[data-select]')
          .forEach((b) => (b.onclick = () => act(() => select(b.dataset.select, b.dataset.kind))));
        document
          .querySelectorAll('[data-save]')
          .forEach(
            (b) =>
              (b.onclick = () => act(() => request('save-review', { runId: b.dataset.save, basis: data.reviewBasis })))
          );
        document
          .querySelectorAll('[data-resume]')
          .forEach(
            (b) =>
              (b.onclick = () =>
                act(() => request('resume', { runId: b.dataset.resume, text: $('resume-' + b.dataset.resume).value })))
          );
        document
          .querySelectorAll('[data-answer]')
          .forEach((b) => (b.onclick = () => submitApproval(b, () => answer(b))));
        if ($('review'))
          $('review').onclick = () =>
            act(async () => {
              selection = { review: true, basis: data.reviewBasis };
              $('selection').innerHTML =
                '<h2>Review the queue?</h2><p>Codex will read the issues and suggest assignments. This starts a read-only chat. It does not save recommendations, start workers or integrate changes.</p>';
              $('approve').textContent = 'Start queue review';
              $('approve').disabled = false;
              $('confirm').showModal();
            });
        if ($('search')) bindQueueFilters();
      }
      async function select(actionId, kind) {
        selection = await request('preflight', { actionId, kind });
        const a = selection.action;
        $('selection').innerHTML =
          `<h2>${kind === 'launch' ? 'Start this worker?' : 'Integrate these changes?'}</h2><h3>${esc(a.title)}</h3><p>${a.issues.map(link).join(' · ')}</p><p>${esc(a.scope)}</p><p>Checks: ${esc(a.verification)}</p><p>Integration policy: ${esc(mergeLabel(a.merge))}</p><p>Target: ${esc(data.root)}</p><p>Current revision: ${esc(selection.head)}</p>${kind === 'integrate' ? `<p>Candidate: ${esc(a.worker_revision)}</p><details><summary>Review candidate changes</summary><pre>${esc(selection.diff)}</pre></details><details><summary>Worker evidence</summary><pre>${esc(a.evidence)}</pre></details><p>A separate coordinator chat will integrate this candidate and run the required checks. A failed check stops completion and keeps the result for review.</p>` : '<p>Codex starts one chat in a separate checkout. No other workers or integrations start automatically.</p>'}<details><summary>Human input reviewed for this action</summary><pre>${esc(JSON.stringify(selection.guards, null, 2))}</pre></details>${selection.requiresApproval ? '<label><input type="checkbox" id="human-approval"> I reviewed and approve this exact candidate for integration.</label>' : ''}`;
        $('approve').textContent = kind === 'launch' ? 'Start worker' : 'Start integration';
        $('approve').disabled = selection.requiresApproval;
        if (selection.requiresApproval)
          $('human-approval').onchange = () => {
            $('approve').disabled = !$('human-approval').checked;
          };
        $('confirm').showModal();
      }
      async function answer(button) {
        const response = { decision: button.dataset.decision };
        if (response.decision === 'answers') {
          response.answers = {};
          document.querySelectorAll('[data-question]').forEach((q) => {
            if (q.dataset.request === button.dataset.answer) response.answers[q.dataset.question] = q.value;
          });
        }
        await request('answer', { runId: button.dataset.run, requestId: button.dataset.answer, response });
      }
      $('close-plan').onclick = () => $('plan').close();
      $('cancel').onclick = () => $('confirm').close();
      $('confirm').onclose = () => {
        $('confirmation-error').textContent = '';
      };
      $('approve').onclick = () =>
        submitApproval($('approve'), async () => {
          if (selection.planSkip)
            await request('skip-plan-checks', { ...selection, reason: $('skip-check-reason').value });
          else if (selection.planDecision)
            await request('plan-decision', { ...selection, result: $('plan-decision-result').value });
          else if (selection.connection)
            await request('connect-worker', {
              ...selection,
              link: $('worker-link').value || $('worker-choice')?.value || '',
            });
          else if (selection.decision)
            await request('issue-decision', { ...selection, reason: $('reopen-reason')?.value || '' });
          else if (selection.progress)
            await request('progress-start', {
              token: selection.token,
              humanApproved: $('human-approval')?.checked === true,
            });
          else if (selection.review) await request('evaluate', { basis: selection.basis });
          else await request('start', { token: selection.token, humanApproved: $('human-approval')?.checked === true });
          $('confirm').close();
        });
      document.addEventListener(
        'toggle',
        (event) => {
          const details = event.target;
          if (!details.open || !details.dataset.runDetails) return;
          const id = details.dataset.runDetails;
          const current = data.runs.find((run) => run.id === id);
          if (!current?.historyAvailable) return;
          const cached = runDetails.get(id);
          const load =
            cached?.updated === current?.updated
              ? Promise.resolve(cached)
              : request('run?id=' + encodeURIComponent(id));
          load
            .then((run) => {
              runDetails.set(id, run);
              if (runDetails.size > 20) runDetails.delete(runDetails.keys().next().value);
              details.querySelector('pre').textContent =
                (run.output || []).map((entry) => entry.text).join('\n\n') || 'No completed output yet.';
            })
            .catch((error) => {
              details.querySelector('pre').textContent = error.message;
            });
        },
        true
      );
      window.onhashchange = () => {
        if (data) render();
        void refresh();
      };
      refresh();
      setInterval(refresh, 4000);
    </script>
  </body>
</html>
