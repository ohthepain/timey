  <script>
    const reports = [
      {
        id: 'quality-21',
        title: 'Where verification loses time',
        date: '21 Nov 2026 · 09:30',
        run: 'Run 2',
        issue: 'Verification workflow investigation',
        key: 'verification',
        summary:
          'Repeated checks obscure the result that matters. Keep evidence tied to a candidate and make the next action explicit.',
        findings: [
          [
            'The same candidate is checked repeatedly',
            'A finished check is discarded when the workflow changes state, even when the source and verification inputs have not changed.',
            'verification-reuse.mjs:48',
          ],
          [
            'A paused route looks ready to continue',
            'Turning off No new actions leaves the route paused. The next action needs to remain visible beside the retained result.',
            'flow-service.mjs:932',
          ],
        ],
      },
      {
        id: 'quality-19',
        title: 'Verification ownership and evidence',
        date: '19 Nov 2026 · 14:10',
        run: 'Run 1',
        issue: 'Verification workflow investigation',
        key: 'verification',
        summary: 'Verification records need a clear owner and a stable reference to the source that was checked.',
        findings: [
          [
            'Candidate identity is split across records',
            'The attempt and delivery record can retain different candidate metadata. Readers need to see which revision the result proves.',
            'candidate-records.mjs:75',
          ],
          [
            'Useful failure evidence is hard to find',
            'A single result should link the command, output, candidate, and next step.',
            'verification-results.mjs:31',
          ],
        ],
      },
      {
        id: 'architecture-20',
        title: 'A clearer boundary for project conversations',
        date: '20 Nov 2026 · 11:45',
        run: 'Run 1',
        issue: 'Project architecture investigation',
        key: 'architecture',
        summary:
          'Project discussion can share tools with issue discussion while keeping conversation history and work ownership explicit.',
        findings: [
          [
            'Tool registration should have one source',
            'Report chat needs the same registered skills and tools as project chat.',
            'project-discuss-provider.mjs:116',
          ],
        ],
      },
    ];
    let variant = new URLSearchParams(location.search).get('variant') || 'A';
    if (!['A', 'B', 'C'].includes(variant)) variant = 'A';
    const query = new URLSearchParams(location.search);
    let selected = reports.some((r) => r.id === query.get('report')) ? query.get('report') : null,
      chatOpen = query.get('discuss') === '1',
      screen = 'reports',
      evidenceOpen = false;
    const readingState = {};
    const chats = {},
      drafts = {};
    const names = { A: 'Focused reader', B: 'Report browser', C: 'Full-width discussion' };
    const view = document.getElementById('view');
    const esc = (s) =>
      String(s).replace(
        /[&<>"']/g,
        (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]
      );
    const report = () => reports.find((r) => r.id === selected);
    function rows(compact = false) {
      return reports
        .map(
          (r) =>
            `<button class="report-row ${selected === r.id ? 'selected' : ''}" data-report="${r.id}"><div><strong>${r.title}</strong><small>${r.issue} · ${r.run}</small>${compact ? '' : `<p>${r.summary}</p>`}</div><span class="date">${r.date}</span></button>`
        )
        .join('');
    }
    function paper(r) {
      return `<article class="paper"><div class="eyebrow">Investigation report</div><h1>${r.title}</h1><div class="byline">${r.date} · ${r.run}<br>${r.issue} · Committed snapshot · Sample content</div><div class="summary"><h3>Executive summary</h3><p>${r.summary}</p></div><h2>Findings</h2>${r.findings.map(([title, body, path], i) => `<section class="finding"><div class="severity">FINDING ${i + 1} · NEEDS ATTENTION</div><h3>${title}</h3><p>${body}</p><button class="evidence" data-evidence>View supporting evidence · ${path}</button></section>`).join('')}${evidenceOpen ? '<div class="evidence-view">Sample evidence preview. A production report opens the retained evidence for this exact run, even when newer results exist.<p><button data-evidence>Close evidence</button></p></div>' : ''}<h2>Recommendations</h2><p>Make the result and its source explicit. Prefer one clear next action over asking the reader to reconcile several records.</p><h2>Scope and limitations</h2><p>This is fixture content for judging the report reader. It does not establish findings about the current project.</p></article>`;
    }
    function chat(r) {
      const history = chats[r.key] || [];
      return `<aside class="chat" aria-label="Investigation discussion"><div class="history discuss-messages">${history.map((m) => `<article class="discuss-message ${m.role === 'You' ? 'user' : 'assistant'}" title="${esc(m.title)}"><div class="discuss-message-heading"><strong>${m.role === 'You' ? 'You' : 'Assistant'}</strong><span class="muted">${m.role === 'You' ? '' : 'Prototype · '}${m.run}</span></div><div class="discuss-message-body"><p>${esc(m.text)}</p></div></article>`).join('')}</div><form class="composer" id="chat-form"><div class="prompt-pills" aria-label="Recommended prompts"><button type="button" data-prompt="Summarize the main findings in plain language.">Summarize findings</button><button type="button" data-prompt="Which finding should we act on first, and why?">What should we do first?</button><button type="button" data-prompt="Create follow-up issues for the actionable findings in this report.">Create follow-up issues</button></div><textarea aria-label="Discuss this report" placeholder="Discuss this report…">${esc(drafts[r.id] || '')}</textarea><div class="controls"><select aria-label="Model"><option>Project model</option><option>Other model…</option></select><select aria-label="Effort"><option>High</option><option>Medium</option></select><button type="button" data-tools>Skills & tools</button><button class="discuss-send-button send" type="submit" aria-label="Send message" title="Send message"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 16V4M5 9l5-5 5 5"/></svg></button></div><div class="toolbox" id="toolbox" hidden>Same registered skills and tools as project chat.<br>Skill picker · project files · issue controls · project operations<br><small>This prototype simulates messages and runs no tools.</small></div></form></aside>`;
    }
    function render() {
      const r = report();
      document.getElementById('variant-name').textContent = variant + ' · ' + names[variant];
      document.getElementById('breadcrumb').textContent = 'Project / Reports' + (r ? ' / ' + r.run : '');
      document.getElementById('state').textContent =
        (r ? r.run + ' · ' + r.key : 'Reports list') + ' · Chat ' + (chatOpen ? 'open' : 'closed');
      view.className = 'view ' + (variant === 'C' ? 'stacked' : '');
      if (screen === 'investigation' && r) {
        view.innerHTML = `<div class="intro"><button class="back" data-return>← Return to report</button><h1>${r.issue}</h1><p class="muted">Prototype investigation workspace</p><div class="flow-card"><strong>Request → Investigate → Generate report → Create Issues</strong>Selected report belongs to ${r.run}. Returning to the report restores its discussion and draft.</div><button data-discuss>Discuss selected report</button></div>`;
        wire();
        return;
      }
      if (!r) {
        view.innerHTML = `<div class="intro"><div class="eyebrow">Project knowledge</div><h1>Reports</h1><p class="muted">Findings worth keeping. Read a report, then discuss what to do next.</p><label>Find a report <input id="search" placeholder="Title or investigation…" style="padding:9px 12px;margin-left:10px"></label></div><div class="index">${rows()}</div>`;
        wire();
        document.getElementById('search').oninput = (e) => {
          const q = e.target.value.toLowerCase();
          view.querySelectorAll('.report-row').forEach((el) => (el.hidden = !el.textContent.toLowerCase().includes(q)));
        };
        return;
      }
      view.innerHTML = `<div class="reader-top"><button class="back" data-home>← All reports</button><select aria-label="Investigation run">${reports
        .filter((x) => x.key === r.key)
        .map((x) => `<option value="${x.id}" ${x.id === r.id ? 'selected' : ''}>${x.run} · ${x.date}</option>`)
        .join(
          ''
        )}</select><div class="actions"><button data-investigation>Open investigation</button><button class="${chatOpen ? 'selected' : 'primary'}" data-discuss>${chatOpen ? 'Hide discussion' : 'Discuss'}</button></div></div><div class="content">${variant === 'B' ? `<nav class="list-pane" aria-label="Saved reports">${rows(true)}</nav>` : ''}<div class="reading">${paper(r)}</div>${chatOpen ? (variant === 'C' ? '<div class="discussion-divider" role="separator" tabindex="0" aria-label="Resize report and discussion" aria-orientation="horizontal" aria-valuemin="230" aria-valuemax="600" aria-valuenow="390" title="Drag to resize. Arrow Up and Arrow Down also resize."></div>' : '') + chat(r) : ''}</div>`;
      wire();
    }
    function choose(id) {
      saveDraft();
      selected = id;
      chatOpen = readingState[id]?.chatOpen || false;
      screen = 'reports';
      evidenceOpen = false;
      render();
    }
    function saveDraft() {
      const r = report();
      if (!r) return;
      const t = view.querySelector('textarea');
      if (t) drafts[r.id] = t.value;
      const reading = view.querySelector('.reading');
      if (reading)
        readingState[r.id] = {
          scroll: reading.scrollTop,
          chatOpen,
          height: view.querySelector('.chat')?.getBoundingClientRect().height || readingState[r.id]?.height,
        };
    }
    function resizeDiscussion(height) {
      const content = view.querySelector('.content'),
        panel = view.querySelector('.chat'),
        divider = view.querySelector('.discussion-divider');
      if (!content || !panel || !divider) return;
      const min = Math.ceil(panel.querySelector('.composer').getBoundingClientRect().height + 48);
      const max = Math.max(min, content.clientHeight - 130);
      const size = Math.round(Math.max(min, Math.min(max, height)));
      divider.setAttribute('aria-valuemin', String(min));
      content.style.setProperty('--discussion-height', size + 'px');
      divider.setAttribute('aria-valuemax', String(max));
      divider.setAttribute('aria-valuenow', String(size));
      readingState[selected] = { ...readingState[selected], height: size };
      document.getElementById('state').textContent = report().run + ' · Discussion ' + size + 'px';
    }
    function wireDivider() {
      const divider = view.querySelector('.discussion-divider');
      if (!divider) return;
      resizeDiscussion(readingState[selected]?.height || view.querySelector('.content').clientHeight * 0.53);
      divider.onpointerdown = (e) => {
        if (e.button !== 0) return;
        e.preventDefault();
        const startY = e.clientY,
          startHeight = view.querySelector('.chat').getBoundingClientRect().height;
        divider.setPointerCapture(e.pointerId);
        document.body.classList.add('resizing');
        divider.onpointermove = (event) => resizeDiscussion(startHeight + startY - event.clientY);
        const end = () => {
          document.body.classList.remove('resizing');
          divider.onpointermove = null;
          divider.onpointerup = null;
          divider.onpointercancel = null;
        };
        divider.onpointerup = end;
        divider.onpointercancel = end;
      };
      divider.onkeydown = (e) => {
        if (!['ArrowUp', 'ArrowDown', 'Home', 'End'].includes(e.key)) return;
        e.preventDefault();
        e.stopPropagation();
        const current = Number(divider.getAttribute('aria-valuenow'));
        resizeDiscussion(
          e.key === 'Home'
            ? 230
            : e.key === 'End'
              ? Number(divider.getAttribute('aria-valuemax'))
              : current + (e.key === 'ArrowUp' ? 24 : -24)
        );
      };
    }

    function wire() {
      const reading = view.querySelector('.reading');
      if (reading) reading.scrollTop = readingState[selected]?.scroll || 0;
      wireDivider();
      view.querySelectorAll('[data-prompt]').forEach(
        (el) =>
          (el.onclick = () => {
            const input = view.querySelector('textarea');
            input.value = el.dataset.prompt;
            drafts[selected] = input.value;
            input.focus();
          })
      );
      view.querySelectorAll('[data-report]').forEach((el) => (el.onclick = () => choose(el.dataset.report)));
      view.querySelectorAll('[data-home]').forEach((el) => (el.onclick = home));
      view.querySelectorAll('[data-discuss]').forEach(
        (el) =>
          (el.onclick = () => {
            saveDraft();
            screen = 'reports';
            chatOpen = !chatOpen;
            render();
          })
      );
      view.querySelectorAll('[data-investigation]').forEach(
        (el) =>
          (el.onclick = () => {
            saveDraft();
            screen = 'investigation';
            render();
          })
      );
      view.querySelectorAll('[data-return]').forEach(
        (el) =>
          (el.onclick = () => {
            screen = 'reports';
            render();
          })
      );
      view.querySelectorAll('[data-evidence]').forEach(
        (el) =>
          (el.onclick = () => {
            saveDraft();
            evidenceOpen = !evidenceOpen;
            render();
          })
      );
      const picker = view.querySelector('[aria-label="Investigation run"]');
      if (picker) picker.onchange = (e) => choose(e.target.value);
      const tools = view.querySelector('[data-tools]');
      if (tools)
        tools.onclick = () => {
          const box = document.getElementById('toolbox');
          box.hidden = !box.hidden;
          if (variant === 'C') resizeDiscussion(readingState[selected]?.height || 390);
        };
      const form = document.getElementById('chat-form');
      if (form)
        form.onsubmit = (e) => {
          e.preventDefault();
          const text = form.querySelector('textarea').value.trim();
          if (!text) return;
          saveDraft();
          const r = report();
          (chats[r.key] ??= []).push(
            { role: 'You', run: r.run, title: r.title, text },
            {
              role: 'Simulated reply',
              run: r.run,
              title: r.title,
              text: 'I would start with the first finding. Review its supporting evidence, agree the next action, and turn that action into a bounded follow-up issue.',
            }
          );
          drafts[r.id] = '';
          render();
          const h = view.querySelector('.history');
          h.scrollTop = h.scrollHeight;
        };
    }
    function home() {
      saveDraft();
      selected = null;
      screen = 'reports';
      render();
    }
    function change(delta) {
      saveDraft();
      const keys = ['A', 'B', 'C'];
      variant = keys[(keys.indexOf(variant) + delta + 3) % 3];
      const url = new URL(location);
      url.searchParams.set('variant', variant);
      history.replaceState(null, '', url);
      render();
    }
    document.getElementById('prev').onclick = () => change(-1);
    document.getElementById('next').onclick = () => change(1);
    document.addEventListener('keydown', (e) => {
      if (e.target.closest('input,textarea,select,[contenteditable],[role=separator]')) return;
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        change(e.key === 'ArrowLeft' ? -1 : 1);
      }
    });
    document.querySelectorAll('.sidebar [data-home]').forEach((el) => (el.onclick = home));
    document.querySelector('[data-project-chat]').onclick = () => {
      if (!selected) selected = reports[0].id;
      chatOpen = true;
      screen = 'reports';
      render();
    };
    render();
  </script>
</html>
