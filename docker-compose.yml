version: '3.8'

services:
  postgres:
    image: postgres
    container_name: postgres
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./docker/postgres/postgres-entrypoint.sh:/postgres-entrypoint.sh
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=postgres
      - CREATE_DATABASE_01=timey_db
      - CREATE_DATABASE_02=keycloakdb
    entrypoint: /postgres-entrypoint.sh
    user: 'postgres'
    command:
      - postgres
      - -c
      - max_connections=1000

  # keycloak:
  #   image: quay.io/keycloak/keycloak:latest
  #   environment:
  #     KC_DB: postgres
  #     KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak_db
  #     KC_DB_USERNAME: keycloak
  #     KC_DB_PASSWORD: keycloakpassword
  #   depends_on:
  #     - keycloak-db

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.0
    container_name: keycloak
    ports:
      - 8082:8082
    # volumes:
    #   - ${KEYCLOAK_IMPORT_DIR:-./docker/oauth/data}:/opt/keycloak/data/import
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_USERNAME: ${DB_USER}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloakdb
      KC_HEALTH_ENABLED: true
    depends_on:
      - postgres
    command:
      [
        'start-dev',
        '--import-realm',
        '--http-port=8082',
        '--health-enabled=true',
        '--hostname-strict=false',
        '--proxy-headers=forwarded',
      ]

volumes:
  postgres:
